<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pesquisa Xtreme</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --ink:#0B0B0B; --muted:#4A4A4A; --line:#D4D4D4;
  --accent:#A4511A; --accent-ink:#FFFFFF; --soft:#F6E6DC;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0B; --surface:#1A1A1A; --ink:#FFFFFF; --muted:#B8B8B8; --line:#3A3A3A;
  --accent:#C76A2A; --accent-ink:#0B0B0B; --soft:#2A1A12;
  --good:#5CC28F; --good-bg:#14301F; --warn:#E5A14B; --warn-bg:#35260F; --bad:#F0867C; --bad-bg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#1A1A1A; --ink:#FFFFFF; --muted:#B8B8B8; --line:#3A3A3A;
  --accent:#C76A2A; --accent-ink:#0B0B0B; --soft:#2A1A12;
  --good:#5CC28F; --good-bg:#14301F; --warn:#E5A14B; --warn-bg:#35260F; --bad:#F0867C; --bad-bg:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-inline:16px;padding-block:20px 64px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.05}
h2{font-size:22px;font-weight:700;line-height:1.15}
.brand{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.note{font-size:13px;color:var(--muted);margin:0}
.lead{margin:0;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}

.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q>label,.q>.lab{font-weight:600;font-size:15px}
.opt{font-weight:400;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--f-body);padding:10px 14px;border-radius:8px;cursor:pointer;text-align:left;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.scale{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scale .chip{min-width:48px;text-align:center;padding-inline:0}
.scalelab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
input[type=text],input[type=number],textarea{font:16px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}

button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);padding:12px 18px;border-radius:8px;cursor:pointer;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.swb{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;font:600 14px var(--f-body);color:var(--ink)}
.swb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.swb .blk{height:84px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#C76A2A;font:700 28px var(--f-display)}
.swdot{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:-4px;margin-right:6px;border:1px solid var(--line)}
.sig{border:1px solid var(--line);border-radius:10px;padding:14px;font:700 20px/1.2 var(--f-display);background:var(--surface)}
.metodo{display:flex;border-radius:10px;overflow:hidden;height:84px;border:1px solid var(--line)}
.metodo b{flex:1;display:flex;align-items:center;justify-content:center;font:700 14px var(--f-display);letter-spacing:.08em}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.consent input{width:22px;height:22px;margin-top:2px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--f-body);padding:10px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.res{display:flex;flex-direction:column;gap:12px;min-width:0}
.rrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.quote{margin:0;padding:6px 10px;border-left:3px solid var(--line);color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpis div{background:var(--surface);padding:12px 14px}
.kpis small{display:block;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpis b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.chipok{display:inline-block;padding:1px 8px;border-radius:99px;font:600 11px var(--f-mono);background:var(--soft)}
.chipok.good{background:var(--good-bg);color:var(--good)} .chipok.warn{background:var(--warn-bg);color:var(--warn)} .chipok.bad{background:var(--bad-bg);color:var(--bad)}
pre.copy{white-space:pre-wrap;word-break:break-word;font:13px/1.5 var(--f-mono);background:var(--soft);padding:12px;border-radius:8px;max-height:260px;overflow:auto;margin:0}
</style>

</head><body>

</div>
<div id="toast" class="toast" hidden></div>

<script>

    {id:"s5",title:"Frases",intro:"Veja três frases que uma marca poderia usar. A ordem muda de pessoa para pessoa.",build:function(){

      sigOrd.forEach(function(k,i){qs.push({k:"sig"+k,t:"Frase "+(i+1)+': de 1 a 5, o quanto você entendeu o que essa marca promete?',type:"scale",lo:"Não entendi",hi:"Entendi bem"})});

    }else if(q.type==="multi"){
      v=v||[];
      h+='<div class="chips" data-k="'+q.k+'" data-m="1" data-max="'+(q.max||0)+'">'+q.o.map(function(o){return '<button type="button" class="chip" data-v="'+esc(o[0])+'" aria-pressed="'+(v.indexOf(o[0])>=0)+'">'+esc(o[1])+'</button>'}).join("")+'</div>';
    }else if(q.type==="scale"){
      h+='<div class="scale" data-k="'+q.k+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" class="chip" data-v="'+n+'" aria-pressed="'+(v===n)+'">'+n+'</button>'}).join("")+'</div><div class="scalelab"><span>1 · '+esc(q.lo)+'</span><span>5 · '+esc(q.hi)+'</span></div>';
    }else if(q.type==="swatch"){
      h+='<div class="sw" data-k="'+q.k+'">'+q.o.map(function(o){var c=COR[o[0]];return '<button type="button" class="swb" data-v="'+esc(o[0])+'" aria-pressed="'+(v===o[0])+'">'+(c?'<div class="blk" style="background:'+c+'">X</div>':'<div class="blk" style="background:var(--soft);color:var(--muted);font-size:16px">—</div>')+esc(o[1])+'</button>'}).join("")+'</div>';
    }else if(q.type==="num"){
      h+='<input type="number" inputmode="numeric" min="0" step="1" data-t="'+q.k+'" value="'+esc(v==null?"":v)+'" placeholder="R$">';
    }else if(q.type==="text"){
      h+=q.line?'<input type="text" data-t="'+q.k+'" value="'+esc(v||"")+'">':'<textarea data-t="'+q.k+'" placeholder="'+esc(q.ph||"")+'">'+esc(v||"")+'</textarea>';
    }
    return h+'</div>';
  }
  function progress(i){var total=SECTIONS.length;return '<div class="progtxt"><span>Parte '+(i+1)+' de '+total+'</span><span>cerca de '+Math.max(1,Math.round((total-i)*1.1))+' min</span></div><div class="prog"><i style="width:'+Math.round((i+1)/total*100)+'%"></i></div>'}
  function renderForm(){
    var el=$("app");
    if(sent){
      var txt=summaryText();
      el.innerHTML='<div class="card"><h2>Obrigada!</h2><p class="lead">'+(db?"Suas respostas foram enviadas. Elas ajudam a decidir o que a gente vai produzir.":"Não foi possível enviar direto desta tela. Copie suas respostas abaixo e mande para o Leo ou para a Laís pelo WhatsApp.")+'</p>'+(db?"":'<pre class="copy" id="cp">'+esc(txt)+'</pre><button class="btn primary" id="copyBtn" type="button">Copiar respostas</button>')+'</div>';
      var cb=$("copyBtn"); if(cb)cb.onclick=function(){try{navigator.clipboard.writeText(txt).then(function(){toast("Copiado.")},function(){selectCp()})}catch(e){selectCp()}};
      return;
    }
    if(step<0){
      el.innerHTML='<div class="card"><p class="lead">Estamos criando uma marca de moda para mulheres que treinam força. Antes de comprar qualquer peça, queremos ouvir quem treina de verdade. Leva cerca de 8 minutos.</p>'+
        '<ul class="note" style="padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px"><li>Não existe resposta certa. Crítica ajuda mais do que elogio.</li><li>Isto não é uma venda: ninguém vai cobrar nada.</li><li>Não pedimos nome nem dado de saúde. Se quiser ser avisada da pré-venda, o contato é opcional e fica separado das respostas.</li><li>As respostas ficam com a equipe da Xtreme e servem só para decidir o que produzir. Você pode parar quando quiser.</li></ul>'+
        '<label class="consent"><input type="checkbox" id="cons"'+(consent?" checked":"")+'><span>Entendi e aceito responder à pesquisa.</span></label>'+
        '<div class="nav"><span></span><button class="btn primary" id="go" type="button"'+(consent?"":" disabled")+'>Começar</button></div></div>';
      $("cons").onchange=function(){consent=this.checked;$("go").disabled=!consent};
      $("go").onclick=function(){if(consent){step=0;renderForm();window.scrollTo(0,0)}};
      return;
    }
    var s=SECTIONS[step], last=step===SECTIONS.length-1;
    el.innerHTML='<div class="card">'+progress(step)+'<h2>'+esc(s.title)+'</h2><p class="lead">'+esc(s.intro)+'</p>'+secQs(s).map(renderQ).join("")+
      '<div class="nav"><button class="btn" id="back" type="button">Voltar</button><button class="btn primary" id="next" type="button">'+(last?"Enviar respostas":"Continuar")+'</button></div></div>';
    $("back").onclick=function(){step--;renderForm();window.scrollTo(0,0)};
    $("next").onclick=function(){if(last)submit();else{step++;renderForm();window.scrollTo(0,0)}};
  }
  function selectCp(){var p=$("cp");if(!p)return;var r=document.createRange();r.selectNodeContents(p);var s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selecione e copie o texto.")}
  function allQs(){var out=[];SECTIONS.forEach(function(s){secQs(s).forEach(function(q){if(q.k)out.push(q)})});return out}
  function labelOf(q,v){if(v==null||v==="")return "";var f=function(x){var o=(q.o||[]).filter(function(o){return o[0]===x})[0];return o?o[1]:x};return Array.isArray(v)?v.map(f).join(", "):(q.type==="single"||q.type==="swatch"?f(v):v)}
  function plain(t){return String(t).replace(/<[^>]*>/g,"")}
  function summaryText(){return "Pesquisa Xtreme\n"+allQs().map(function(q){var v=labelOf(q,A[q.k]);return v===""||v==null?null:plain(q.t)+" "+v}).filter(Boolean).join("\n")}

  document.addEventListener("click",function(ev){
    var t=ev.target.closest(".chip,.swb,.tab"); if(!t)return;
    if(t.classList.contains("tab")){setTab(t.dataset.tab);return}
    var box=t.parentElement; if(!box||!box.dataset.k)return;
    var k=box.dataset.k, v=t.dataset.v;
    if(box.dataset.m){
      var cur=(A[k]||[]).slice(), i=cur.indexOf(v), max=parseInt(box.dataset.max,10)||0;
      if(i>=0)cur.splice(i,1); else{ if(max&&cur.length>=max){toast("Marque até "+max+".");return} cur.push(v)}
      A[k]=cur;
    }else{
      var val=box.classList.contains("scale")?parseInt(v,10):v;
      A[k]=(A[k]===val)?null:val;
    }
    var sy=window.scrollY; renderForm(); window.scrollTo(0,sy);
  });
  document.addEventListener("input",function(ev){var t=ev.target;if(t.dataset&&t.dataset.t){A[t.dataset.t]=t.type==="number"?num(t.value):t.value}});

  /* ---------- envio ---------- */
  function submit(){
    var b=$("next"); b.disabled=true;
    var d={}; Object.keys(A).forEach(function(k){var v=A[k];if(v!==null&&v!==undefined&&v!==""&&!(Array.isArray(v)&&!v.length))d[k]=v});
    if(d.aviso!=="sim")delete d.contato;
    d.enviadoEm=Date.now();
    var contato=d.contato; delete d.contato;
    if(!db){sent=true;renderForm();return}
    var payload={id:uid,dados:d,aviso:contato?{contato:contato}:null};
    fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
      .then(function(){sent=true;renderForm()})
      .catch(function(){b.disabled=false;toast("Não foi possível enviar. Verifique a internet e tente de novo.")});
  }

  /* ---------- resultados (quem administra) ---------- */
  function cntBy(k,v,multi){return rows.filter(function(r){return multi?(r[k]||[]).indexOf(v)>=0:r[k]===v}).length}
  function barRows(q){
    var n=rows.filter(function(r){var v=r[q.k];return v!=null&&(!Array.isArray(v)||v.length)}).length||0;
    return '<div class="res">'+q.o.map(function(o){var c=cntBy(q.k,o[0],q.type==="multi");return '<div class="rrow"><span>'+esc(o[1])+'</span><div class="bar"><i style="width:'+(n?Math.round(c/n*100):0)+'%"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums">'+c+'</span></div>'}).join("")+'<span class="note">'+n+' respostas</span></div>';
  }
  var RQ=[]; // perguntas fixas para o resumo (sem os sorteios)
  function fixedQs(){
    var out=[]; SECTIONS.forEach(function(s){ if(s.qs)s.qs.forEach(function(q){if(q.k)out.push(q)}) }); return out;
  }
  function renderRes(){
    var el=$("app");
    if(!loadedRows){el.innerHTML='<div class="card">Carregando…</div>';return}
    var n=rows.length;
    var sig={A:0,B:0,C:0,nenhuma:0}; rows.forEach(function(r){if(sig[r.sigAmiga]!=null)sig[r.sigAmiga]++});
    var sigMap=function(){return rows};
    // sigAmiga guarda a chave da frase (A/B/C): ok, independe da ordem sorteada
    var cc={terracota:0,vinho:0,oliva:0}, cm={terracota:0,vinho:0,oliva:0}; rows.forEach(function(r){if(cc[r.corConforto]!=null)cc[r.corConforto]++;if(cm[r.corMenos]!=null)cm[r.corMenos]++});
    var ccN=cc.terracota+cc.vinho+cc.oliva, warm=cc.terracota+cc.vinho, oliTop=cc.oliva>=Math.max(cc.terracota,cc.vinho);
    var irma=cntBy("corMarca","irma"), marcaN=rows.filter(function(r){return r.corMarca}).length;
    var p={149:{n:0,sim:0,talvez:0},169:{n:0,sim:0,talvez:0}}; rows.forEach(function(r){var a=p[r.precoMostrado];if(a&&r.intencao){a.n++;if(r.intencao==="sim")a.sim++;if(r.intencao==="talvez")a.talvez++}});
    var caro=rows.map(function(r){return num(r.caro)}), barato=rows.map(function(r){return num(r.barato)});
    var incomoda=SECTIONS[2].qs[2];
    var cv=function(v){var g=rows.filter(function(r){return r.catDesc===v});return {n:g.length,int:mean(g.map(function(r){return num(r.catInteresse)})),pre:mean(g.map(function(r){return num(r.catPremium)})),caro:median(g.map(function(r){return num(r.caro)})),barato:median(g.map(function(r){return num(r.barato)})),sim:g.filter(function(r){return r.intencao==="sim"}).length,ni:g.filter(function(r){return r.intencao}).length}};
    var kp='<div class="kpis"><div><small>Respostas</small><b>'+n+'</b></div><div><small>Querem aviso</small><b>'+cntBy("aviso","sim")+'</b></div><div><small>Ainda não são alunas</small><b>'+cntBy("tempoLeo","nao")+'</b></div><div><small>Usam fora do treino</small><b>'+cntBy("foraUso","sim")+'</b></div></div>';
    var s=function(t){return '<div class="card"><h2 style="font-size:18px">'+t+'</h2>'};
    var html=kp+
      '<div class="card"><p class="note">Quem responde é aluna do Leo: tende a avaliar melhor do que o público em geral. Os números dão direção, não prova. A demanda real só aparece quando alguém paga, na pré-venda.</p></div>'+
      s("O que mais incomoda hoje")+barRows(incomoda)+'</div>'+
      s("Cor")+
        '<div class="res"><span class="note">Mais conforto e sofisticação: terracota '+cc.terracota+' · vinho '+cc.vinho+' · oliva '+cc.oliva+' · '+(ccN<10?'<span class="chipok warn">Em andamento</span>':((warm>=12&&!oliTop)?'<span class="chipok good">Passa em H9</span>':(ccN>=20?'<span class="chipok bad">Não passa em H9</span>':'<span class="chipok warn">Em andamento</span>')))+'</span>'+
        '<span class="note">Combina menos com treino: terracota '+cm.terracota+' · vinho '+cm.vinho+' · oliva '+cm.oliva+'</span>'+
        '<span class="note">Ao lado do Método: marca irmã '+irma+' de '+marcaN+' · mesma '+cntBy("corMarca","mesma")+' · outra '+cntBy("corMarca","outra")+' · '+(marcaN<10?'<span class="chipok warn">Em andamento</span>':(irma>=12?'<span class="chipok good">Passa em H10</span>':(marcaN>=20?'<span class="chipok bad">Não passa em H10</span>':'<span class="chipok warn">Em andamento</span>')))+'</span>'+
        ["terracota","vinho","oliva"].map(function(k){var q=rows.filter(function(r){return r["lembra_"+k]}).map(function(r){return '<p class="quote">'+esc(r["lembra_"+k])+'</p>'}).join("");return '<h3 style="font-size:14px"><span class="swdot" style="background:'+COR[k]+'"></span>O que a '+k+' lembra</h3>'+(q||'<p class="note">Nenhuma resposta ainda.</p>')}).join("")+'</div></div>'+
      s("Frases")+'<div class="res"><span class="note">Qual contaria a uma amiga: A '+sig.A+' · B '+sig.B+' · C '+sig.C+' · nenhuma '+sig.nenhuma+'</span>'+
        ["A","B","C"].map(function(k){return '<span class="note">'+esc(SIG[k])+': entendimento médio '+f1(mean(rows.map(function(r){return num(r["sig"+k])})))+' de 5</span>'}).join("")+'</div></div>'+
      s("Preço")+'<div class="res"><span class="note">"Caro demais": mediana R$ '+(median(caro)==null?"—":median(caro))+' · "barato demais": mediana R$ '+(median(barato)==null?"—":median(barato))+'</span>'+
        [149,169].map(function(v){var a=p[v];return '<span class="note">Mostrado R$ '+v+': '+a.sim+' sim e '+a.talvez+' talvez de '+a.n+'</span>'}).join("")+'</div>'+barRows(SECTIONS[7].qs[5])+'</div>'+
      s("Como a marca se apresenta (A contra B)")+'<div class="res"><span class="note">Quem viu cada versão respondeu também ao preço. Com poucas respostas por grupo, isto dá direção, não conclusão.</span>'+
        ["A","B"].map(function(v){var c=cv(v);return '<div class="rrow" style="grid-template-columns:1fr"><b>'+esc(CAT[v][0])+'</b><span class="note">'+c.n+' respostas · interesse '+f1(c.int)+' de 5 · premium '+f1(c.pre)+' de 5 · "caro demais" mediana R$ '+(c.caro==null?"—":c.caro)+' · "barato demais" mediana R$ '+(c.barato==null?"—":c.barato)+' · compraria: '+c.sim+' sim de '+c.ni+'</span>'+
          rows.filter(function(r){return r.catDesc===v&&r.catParaQuem}).map(function(r){return '<p class="quote">'+esc(r.catParaQuem)+'</p>'}).join("")+'</div>'}).join("")+'</div></div>'+
      s("Tamanho")+barRows(SECTIONS[1].qs[3])+'</div>'+
      s("Uso fora do treino")+barRows(SECTIONS[3].qs[0])+barRows(SECTIONS[3].qs[3])+'</div>'+
      s("Palavras livres")+'<div class="res"><h3 style="font-size:14px">Xtreme imagina</h3>'+(rows.filter(function(r){return r.imagina}).map(function(r){return '<p class="quote">'+esc(r.imagina)+'</p>'}).join("")||'<p class="note">Nenhuma ainda.</p>')+
        '<h3 style="font-size:14px">Peça que não pode faltar</h3>'+(rows.filter(function(r){return r.naoFalta}).map(function(r){return '<p class="quote">'+esc(r.naoFalta)+'</p>'}).join("")||'<p class="note">Nenhuma ainda.</p>')+
        '<h3 style="font-size:14px">Por que troca de roupa</h3>'+(rows.filter(function(r){return r.trocaPorque}).map(function(r){return '<p class="quote">'+esc(r.trocaPorque)+'</p>'}).join("")||'<p class="note">Nenhuma ainda.</p>')+
        '<h3 style="font-size:14px">Outras observações</h3>'+(rows.filter(function(r){return r.livre}).map(function(r){return '<p class="quote">'+esc(r.livre)+'</p>'}).join("")||'<p class="note">Nenhuma ainda.</p>')+'</div></div>'+
      '<div class="nav"><span class="note">Contatos da lista de aviso ficam em outra coleção, separada das respostas.</span><button class="btn" id="csv" type="button">Baixar CSV das respostas</button></div>';
    el.innerHTML=html;
    $("csv").onclick=downloadCsv;
  }
  function downloadCsv(){
    claude.use("downloads").then(function(d){
      if(!d){toast("Download indisponível aqui.");return}
      var keys={}; rows.forEach(function(r){Object.keys(r).forEach(function(k){if(k!=="id")keys[k]=1})});
      var cols=Object.keys(keys).sort();
      var q=function(v){if(Array.isArray(v))v=v.join(";");v=v==null?"":String(v);return '"'+v.replace(/"/g,'""')+'"'};
      var csv=cols.map(q).join(",")+"\n"+rows.map(function(r){return cols.map(function(c){return q(r[c])}).join(",")}).join("\n");
      return d.save({filename:"pesquisa-xtreme.csv",data:csv}).then(function(){toast("Arquivo salvo.")});
    }).catch(function(){toast("Não foi possível baixar.")});
  }

  function setTab(t){
    tab=t; Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false")});
    render();
  }
  function render(){ if(tab==="res"&&isAdmin)renderRes(); else renderForm(); }

  db=ENDPOINT.indexOf("http")===0;
  try{uid=localStorage.getItem("xt-id")}catch(e){}
  if(!uid){uid="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);try{localStorage.setItem("xt-id",uid)}catch(e){}}
  render();
})();
</script>
</body></html>
